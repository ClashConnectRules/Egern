ipv6: true
vif_only: true
hide_vpn_icon: false
hijack_dns:
- '*:53'
geoip_db_url: https://raw.githubusercontent.com/Masaiki/GeoIP2-CN/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-ASN.mmdb
direct_latency_test_url: http://wifi.vivo.com.cn/generate_204
compat_route: false
vif_excluded_routes:
- boc.com
- cmbchina.com
dns:
  bootstrap:
  - 223.5.5.5
  - 119.29.29.29
  - 1.12.12.12
  - 120.53.53.53
  - 2400:3200::1
  upstreams:
    AdBlack:
    - quic://dns.adguard-dns.com
    - https://dns.adguard-dns.com/dns-query
    Alibaba:
    - 223.5.5.5
    - https://dns.alidns.com/dns-query
    Tencent:
    - 119.29.29.29
    - https://doh.pub/dns-query
    ByteDance:
    - 180.184.2.2
    - 180.184.1.1
    China:
    - 223.5.5.5
    - 119.29.29.29
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    Global:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  forward:
  - proxy_rule_set:
      match: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/reject.txt
      value: AdBlack
      disabled: false
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/Alibaba.lsr
      value: Alibaba
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/Tencent.lsr
      value: Tencent
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/DouYin.lsr
      value: ByteDance
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/Apple.lsr
      value: China
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/ChinaMax.lsr
      value: China
  - proxy_rule_set:
      match: https://rule.kelee.one/Loon/Global.lsr
      value: Global
  - domain_wildcard:
      match: '*'
      value: Global
  proxy_nameservers:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  public_ip_lookup_url: https://ifconfig.me/ip
policy_groups:
- select:
    name: Mainland
    policies:
    - DIRECT
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/direct.png
    hidden: false
- external:
    name: AllServer
    type: select
    urls:
    - https://your-subscription-url
    filter: '^((?!Remain|Expired|官网|如需|套餐|去除|剩余|距离|Reset|重置|流量).)+$'
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/rocket(1).png
    hidden: false
- select:
    name: Hong Kong
    policies:
    - AllServer
    flatten: true
    filter: '\U0001F1ED\U0001F1F0|香港|Hong\s*Kong|HongKong|HK(?!G)|HKG'
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/Hongkong.png
    hidden: false
- select:
    name: Taiwan
    policies:
    - AllServer
    flatten: true
    filter: '\U0001F1F9\U0001F1FC|台湾|Taiwan|TW(?!N)|Tai|TWN'
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/taiwan.png
    hidden: false
- select:
    name: Japan
    policies:
    - AllServer
    flatten: true
    filter: '\U0001F1EF\U0001F1F5|日本|Japan|JP(?!N)|JPN'
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/Japan.png
    hidden: false
- select:
    name: Singapore
    policies:
    - AllServer
    flatten: true
    filter: '\U0001F1F8\U0001F1EC|新加坡|狮城|Singapore|SG(?!P)|SGP'
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/singapore.png
    hidden: false
- select:
    name: United States
    policies:
    - AllServer
    flatten: true
    filter: '\U0001F1FA\U0001F1F8|美国|United\s*States|USA|US(?!A)|States|American'
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/US.png
    hidden: false
- select:
    name: United Kingdom
    policies:
    - AllServer
    flatten: true
    filter: '\U0001F1EC\U0001F1E7|英国|United\s*Kingdom|UK(?!S)'
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/UnitedKingdom.png
    hidden: false
- select:
    name: Korea
    policies:
    - AllServer
    flatten: true
    filter: '\U0001F1F0\U0001F1F7|韩国|Korea|KR(?!W)|KOR'
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/Korea.png
    hidden: false
- select:
    name: Other
    policies:
    - AllServer
    flatten: true
    filter: '^(?!.*(\U0001F1ED\U0001F1F0|香港|Hong\s*Kong|HongKong|HK(?!G)|HKG|\U0001F1F9\U0001F1FC|台湾|Taiwan|TW(?!N)|Tai|TWN|\U0001F1EF\U0001F1F5|日本|Japan|JP(?!N)|JPN|\U0001F1F8\U0001F1EC|新加坡|狮城|Singapore|SG(?!P)|SGP|\U0001F1FA\U0001F1F8|美国|United\s*States|USA|US(?!A)|States|American|\U0001F1EC\U0001F1E7|英国|United\s*Kingdom|UK(?!S)|\U0001F1F0\U0001F1F7|韩国|Korea|KR(?!W)|KOR)).*$'
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/EuropeanUnion.png
    hidden: false
- auto_test:
