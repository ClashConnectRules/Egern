      policy: DIRECT
  - ip_cidr:
      match: "192.168.0.0/16"
      policy: DIRECT
  - ip_cidr:
      match: "224.0.0.0/4"
      policy: DIRECT
  - ip_cidr:
      match: "240.0.0.0/4"
      policy: DIRECT
  - ip_cidr:
      match: "255.255.255.255/32"
      policy: DIRECT

  - default:
      policy: NoAuto

