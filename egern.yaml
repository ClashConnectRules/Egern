policy_groups:
  - select:
      name: Mainland
      policies:
        - DIRECT
      icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/direct.png
      hidden: false

  - external:
      name: AllServer
      type: select
      urls:
        - 'Your Surge subscription link goes here'
      filter: '^((?!Remain|Expired|官网|如需|套餐|去除|剩余|距离|Reset|重置|流量).)+$'
      icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/rocket(1).png
      hidden: false

  - select:
      name: Hong Kong
      policies:
        - AllServer
      flatten: true
      filter: 🇭🇰|香港|Hong\s*Kong|HongKong|HK(?!G)|HKG
      icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/Hongkong.png
      hidden: false

  - select:
      name: Taiwan
      policies:
        - AllServer
      flatten: true
      filter: 🇹🇼|台湾|Taiwan|TW(?!N)|Tai|TWN
      icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/taiwan.png
      hidden: false

  - select:
      name: Japan
      policies:
        - AllServer
      flatten: true
      filter: 🇯🇵|日本|Japan|JP(?!N)|JPN
      icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/Japan.png
      hidden: false

  - select:
      name: Singapore
      policies:
        - AllServer
      flatten: true
      filter: 🇸🇬|新加坡|狮城|Singapore|SG(?!P)|SGP
      icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/singapore.png
      hidden: false

  - select:
      name: United States
      policies:
        - AllServer
      flatten: true
      filter: 🇺🇸|美国|United\s*States|USA|US(?!A)|States|American
      icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/US.png
      hidden: false

  - select:
      name: United Kingdom
      policies:
        - AllServer
      flatten: true
      filter: 🇬🇧|英国|United\s*Kingdom|UK(?!S)
      icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/UnitedKingdom.png
      hidden: false

  - select:
      name: Korea
      policies:
        - AllServer
      flatten: true
      filter: 🇰🇷|韩国|Korea|KR(?!W)|KOR
      icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/Korea.png
      hidden: false

  - select:
      name: Other
      policies:
        - AllServer
      flatten: true
      filter: '^(?!.*(🇭🇰|香港|Hong\s*Kong|HongKong|HK(?!G)|HKG|🇹🇼|台湾|Taiwan|TW(?!N)|Tai|TWN|🇯🇵|日本|Japan|JP(?!N)|JPN|🇸🇬|新加坡|狮城|Singapore|SG(?!P)|SGP|🇺🇸|美国|United\s*States|USA|US(?!A)|States|American|🇬🇧|英国|United\s*Kingdom|UK(?!S)|🇰🇷|韩国|Korea|KR(?!W)|KOR)).*$'
      icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/EuropeanUnion.png
      hidden: false

  - auto_test:
      name: Automatic
      policies:
        - Hong Kong
        - Taiwan
        - Japan
        - Singapore
        - United States
        - United Kingdom
        - Korea
      interval: 300
      tolerance: 50
      icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/lightning(5).png
      hidden: false

  - select:
