url_rewrites:
  - match: '^https?:\/\/(www\.)?(g|google)\.cn'
    location: https://www.google.com
    status_code: 302
  - match: '^https?:\/\/(ditu|maps)\.google\.cn'
    location: https://maps.google.com
    status_code: 302
  - match: '^https?:\/\/(www\.)?taobao\.com\/'
    location: https://taobao.com/
    status_code: 302
  - match: '^https?:\/\/(www\.)?jd\.com\/'
    location: https://www.jd.com/
    status_code: 302
  - match: '^https?:\/\/(www\.)?mi\.com\/'
    location: https://www.mi.com/
    status_code: 302
  - match: '^https?:\/\/you\.163\.com\/'
    location: https://you.163.com/
    status_code: 302
  - match: '^https?:\/\/(www\.)?suning\.com\/'
    location: https://suning.com/
    status_code: 302
  - match: '^https?:\/\/(www\.)?yhd\.com\/'
    location: https://yhd.com/
    status_code: 302
  - match: '^https?:\/\/api\.abema\.io\/v\d\/ip\/check'
    location: ''
    status_code: -1

header_rewrites:
  - replace:
      match: '^https:\/\/github\.com\/'
      name: Accept-Language
      value: en-us
      type: request
  - replace:
      match: '^https:\/\/(raw|gist)\.githubusercontent\.com\/'
      name: Accept-Language
      value: en-us
      type: request

mitm:
  ca_p12: egern.p12
  ca_passphrase: egern
  hostnames:
    includes:
      - www.google.cn
      - api.abema.io
      - '*.zhihu.com'
      - sub.store
    excludes: []
